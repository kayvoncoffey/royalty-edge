[project]
name = "royalty-edge"
version = "0.2.0"
description = "Quantitative pricing of music and IP royalty catalogs listed at auction"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "requests>=2.31",
    "pyarrow>=14.0",
    "pytz",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter", "matplotlib", "seaborn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
